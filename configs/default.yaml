# M0: the main configuration. Every file in configs/ablations/ extends this one and changes
# one factor. Frozen with the v0.1-frozen tag (CLAUDE.md 2.4).
#
# llm.model is left unset on purpose: the model comes from MODEL_MAIN in .env (and the
# summarizer from MODEL_CHEAP), so the same files run on any model. The recorded replays use
# tests/fixtures/toy_config.yaml, which names its model explicitly.

llm:
  thinking: enabled
  reasoning_effort: high   # decided 2026-10-07, see docs/notes.md section 11
  # max_tokens / timeout_s: left to the thinking-paired defaults (65536 / 900 s)

action_space: tools        # bash, view, str_replace, search, todo, submit
planning: "on"             # quoted: a bare `on` is a YAML boolean

context:
  strategy: hybrid         # clear old outputs first, summarize only if that is not enough
  budget_tokens: 128000    # counts the prompt only (CLAUDE.md 5.3)
  high_water: 0.85
  low_water: 0.5
  keep_recent_min_turns: 2
  keep_recent_ratio: 0.25   # upper bound of the protected tail, as a share of budget_tokens
  min_gain_ratio: 0.1
  # What the summarizer reads: the full history as the agent saw it, reasoning included.
  # Shrunk and retried only when a summary call fails for size (docs/notes.md section 12).
  summary_include_reasoning: true
  summary_retries: 3
  summary_clip_chars: 4000
  summary_clip_scale: 0.5

guard:
  enabled: true
  policy_path: configs/policy.yaml

sandbox:
  network_mode: none
  mem_limit: 4g
  cpus: 2.0
  pids_limit: 512

tool_output:
  max_chars: 8000

# Per-task limits. All three are plain configuration: override them in a config file that
# `extends` this one. B0 gets the same values (eval/baselines/run_b0.py reads them from here).
#
# Where the numbers come from (docs/notes.md section 13):
#   max_steps 150   OpenHands' SWE-bench docs use 100 iterations, mini-swe-agent's SWE-bench
#                   config allows 250, SWE-agent has no call limit. A step here, as in
#                   mini-swe-agent (n_calls), is one model call. The dev_5 smoke run (M0-dev):
#                   10, 79, 32, 56 and 12 steps, and these are the tasks rated "<15 min fix".
#                   With 100 the easy task that needed 79 steps would have had a 21% margin,
#                   and verified_50 has harder tasks, so 100 would cut off runs that would
#                   have finished. 150 sits between the two published values.
#   $2.0 per task   SWE-agent's batch commands use $2.00 (its default is $3), mini-swe-agent
#                   $3. Observed: the 79-step task cost $0.27 at a 98% cache hit rate and a
#                   prompt of up to 62k tokens. Arithmetic, not measurement: a 150-step run
#                   whose prompt ramps to the 128k budget would cost about $1 at that cache
#                   hit rate, and about $13 if the cache never hit, so the cap also guards
#                   the cache.
#   1800 s          the dev tasks took 33 to 370 s (about 4.7 s a step on the long ones), so 150
#                   steps would take about twelve minutes plus test runs in the sandbox.
# Re-check after the first full run: five easy tasks are a small sample.
limits:
  max_steps: 150
  max_cost_per_task_usd: 2.0
  max_wall_seconds: 1800

bash_timeout_s: 120
seed: 0
