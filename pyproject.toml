[project]
name = "harness-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "litellm>=1.104.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "swebench>=5.0.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mini-swe-agent>=2.4.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The project is named harness-demo but the importable package is src/harness.
module-name = "harness"

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval/ scripts are run as files (not a package); let tests import them by module name.
# tests/ is on the path so test modules can share tests/fakes.py.
pythonpath = ["eval/swebench", "eval/report", "eval/baselines", "tests"]
asyncio_mode = "auto"
# The toy repository under tests/fixtures has a deliberate bug and its own tests: they are
# test DATA for the agent, not part of this project's suite. (This replaces pytest's
# default list, so the usual ones are repeated.)
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "fixtures"]
markers = [
    "docker: needs a running Docker daemon and the toy image (skipped otherwise)",
    "swebench_image: needs a local SWE-bench instance image (skipped otherwise)",
]

[tool.ruff]
# ruff 0.16 also formats Python code blocks inside Markdown. Our docs (CLAUDE.md, plan.md,
# docs/**) contain illustrative snippets, so keep ruff to real Python sources.
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
# docker/ (Dockerfile, compose) at the repository root is not the `docker` SDK
known-third-party = ["docker"]
